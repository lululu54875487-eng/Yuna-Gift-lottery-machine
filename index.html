select,
input[type="number"]{

  border-radius:12px;

input[type="number"]{

.confetti{

<script>

let skipMode = false;
let isDrawing = false;
let activeDrawId = 0;

function escapeHtml(value){
  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll("\"","&quot;")
    .replaceAll("'","&#039;");
}

function setDrawingState(active){

  isDrawing = active;

  const startButton=document.getElementById("startButton");
  const cancelButton=document.getElementById("cancelButton");

  if(startButton){
    startButton.innerText=active ? "🔄 重新抽獎" : "🎰 開始抽獎";
  }

  if(cancelButton){
    cancelButton.disabled=!active;
  }
}

function isActiveDraw(drawId){
  return isDrawing && drawId===activeDrawId;
}

async function waitForDraw(drawId, ms){
  await sleep(ms);
  return isActiveDraw(drawId);
}

function finishDraw(drawId){
  if(drawId===activeDrawId){
    setDrawingState(false);
  }
}

function sleep(ms){

  if(skipMode){
    return Promise.resolve();
  }

  return new Promise(resolve => setTimeout(resolve, ms));
}

function randomPick(arr){
  return arr[Math.floor(Math.random()*arr.length)];
}

function randomSample(arr, count){

  const pool=[...arr];
  const picked=[];

  while(picked.length<count && pool.length){

    const index=Math.floor(Math.random()*pool.length);
    picked.push(pool.splice(index,1)[0]);
  }

  return picked;
}

function chineseNumberToNumber(text){

  const digitMap={
    "零":0,
    "一":1,
    "二":2,
    "兩":2,
    "三":3,
    "四":4,
    "五":5,
    "六":6,
    "七":7,
    "八":8,
    "九":9
  };

  const unitMap={
    "十":10,
    "百":100,
    "千":1000
  };

  let total=0;
  let current=0;

  for(let char of text){

    if(char in digitMap){
      current=digitMap[char];
      continue;
    }

    if(char in unitMap){
      total+=(current || 1)*unitMap[char];
      current=0;
    }
  }

  return total+current;
}

function getItemSortValue(item){

  const arabicMatch=item.match(/\d+/);

  if(arabicMatch){
    return Number(arabicMatch[0]);
  }

  const chineseMatch=item.match(/[零一二兩三四五六七八九十百千]+/);

  if(chineseMatch){
    return chineseNumberToNumber(chineseMatch[0]);
  }

  return Infinity;
}

function compareItems(a,b){

  const orderA=getItemSortValue(a);
  const orderB=getItemSortValue(b);

  if(orderA!==orderB){
    return orderA-orderB;
  }

  return a.localeCompare(b,"zh-Hant");
}

function getDrawCount(playerCount){

  const value=Number(document.getElementById("drawCount").value);

  if(!Number.isInteger(value) || value<1){
    return 1;
  }

  return Math.min(value, playerCount);
}

function getLotterySettings(){

  const maxWinsValue=
    document.getElementById("maxWins").value;

  return {
    maxWins:maxWinsValue==="unlimited" ? Infinity : Number(maxWinsValue),
    hasWinLimit:maxWinsValue!=="unlimited",
    vipCountsTowardLimit:
      document.getElementById("vipCountsTowardLimit").checked
  };
}

function toHalfWidth(text){

  const punctuationMap={
    "　":" ",
    "、":",",
    "。":".",
    "「":"\"",
    "」":"\"",
    "『":"'",
    "』":"'",
    "【":"[",
    "】":"]",
    "〔":"[",
    "〕":"]",
    "《":"<",
    "》":">",
    "〈":"<",
    "〉":">",
    "～":"~",
    "—":"-",
    "－":"-",
    "…":"..."
  };

  return text.replace(/[！-～　、。「」『』【】〔〕《》〈〉—…]/g, char => {

    if(punctuationMap[char]){
      return punctuationMap[char];
    }

    return String.fromCharCode(char.charCodeAt(0)-0xFEE0);
  });
}

function convertInputToHalfWidth(){

  const input=document.getElementById("input");
  const original=input.value;
  const converted=toHalfWidth(original);

  if(!original){
    alert("請先貼上清單");
    return;
  }

  input.value=converted;
  input.focus();

  alert(original===converted ? "清單中沒有需要轉換的全形字元" : "已將清單轉換成半形符號與英數字");
}

function normalizeForSimilarity(text){

  return toHalfWidth(text)
    .toLowerCase()
    .replace(/\s+/g,"")
    .trim();
}

function extractInputItems(text){

  const items=[];
  const lines=text
    .split("\n")
    .map(v=>v.trim())
    .filter(v=>v);

  for(let line of lines){

    line=line
      .replaceAll("：",":")
      .replaceAll("➡️",":")
      .replaceAll("->",":");

    const itemText=line.includes(":")
      ? line.split(":").slice(1).join(":")
      : line;

    itemText
      .replaceAll("，",",")
      .replaceAll("、",",")
      .split(",")
      .map(v=>v.trim())
      .filter(v=>v)
      .forEach(item=>items.push(item));
  }

  return items;
}

function checkSimilarInputItems(){

  const input=document.getElementById("input");
  const original=input.value;

  if(!original.trim()){
    alert("請先貼上清單");
    return;
  }

  const groups={};

  for(let item of extractInputItems(original)){

    const key=normalizeForSimilarity(item);

    if(!key) continue;

    if(!groups[key]){
      groups[key]=[];
    }

    if(!groups[key].includes(item)){
      groups[key].push(item);
    }
  }

  const suspects=Object.values(groups)
    .filter(group=>group.length>1);

  if(!suspects.length){
    alert("沒有發現疑似因輸入法或英文大小寫造成的重複項目");
    return;
  }

  const message=suspects
    .map((group,index)=>`${index+1}. ${group.join(" / ")}`)
    .join("\n");

  alert(`發現 ${suspects.length} 組疑似相同的項目：\n\n${message}\n\n請確認它們是真的不同獎品，還是只是輸入法、全半形或英文大小寫不同。`);
}

function createConfetti(){

  if(skipMode) return;

  for(let i=0;i<80;i++){

    const confetti=document.createElement("div");

    confetti.className="confetti";

    confetti.style.left=Math.random()*100+"vw";

    confetti.style.background=
      `hsl(${Math.random()*360},100%,70%)`;

    confetti.style.animationDuration=
      (Math.random()*3+2)+"s";

    confetti.style.width=
      confetti.style.height=
      (Math.random()*10+5)+"px";

    document.body.appendChild(confetti);

    setTimeout(()=>{
      confetti.remove();
    },5000);
  }
}

function normalizeLotteryLine(line){
  return line
    .replaceAll(":", "：")
    .replaceAll("➡️", "：")
    .replaceAll("->", "：");
}

function splitFirstColon(line){
  const index=line.indexOf("：");

  if(index<0){
    return [line,""];
  }

  return [
    line.slice(0,index),
    line.slice(index+1)
  ];
}

function parseSimplePlayers(input){

  const warnings=[];
  const seen=new Set();
  const players=[];

  input
    .replaceAll("，",",")
    .replaceAll("、",",")
    .replaceAll("@",",")
    .replaceAll("＠",",")
    .replaceAll("\n",",")
    .split(",")
    .map(v=>v.trim())
    .filter(v=>v)
    .forEach(name=>{

      if(seen.has(name)){
        warnings.push(`「${name}」重複出現，已自動只保留一次。`);
        return;
      }

      seen.add(name);
      players.push(name);
    });

  return {
    players,
    warnings
  };
}

function parseGiftEntries(lines){

  const wants={};
  const numberMap={};
  const warnings=[];
  const errors=[];

  for(let originalLine of lines){

    const line=normalizeLotteryLine(originalLine);

    if(!line.includes("：")){
      warnings.push(`已略過格式不完整的清單列：「${originalLine}」`);
      continue;
    }

    let [name, nums]=splitFirstColon(line);

    name=name.trim();
    nums=nums.trim();

    if(!name){
      errors.push(`清單列缺少姓名：「${originalLine}」`);
      continue;
    }

    if(!nums){
      errors.push(`「${name}」缺少想抽的號碼。`);
      continue;
    }

    const arr=nums
      .replaceAll("，",",")
      .replaceAll("、",",")
      .split(",")
      .map(v=>v.trim())
      .filter(v=>v);

    if(!arr.length){
      errors.push(`「${name}」缺少有效號碼。`);
      continue;
    }

    if(!wants[name]){
      wants[name]=[];
    }else{
      warnings.push(`「${name}」有多列清單，已合併處理。`);
    }

    for(let num of arr){

      if(wants[name].includes(num)){
        warnings.push(`「${name}」重複填寫 ${num} 號，已自動只保留一次。`);
        continue;
      }

      wants[name].push(num);

      if(!numberMap[num]){
        numberMap[num]=[];
      }

      if(!numberMap[num].includes(name)){
        numberMap[num].push(name);
      }
    }
  }

  if(!Object.keys(wants).length){
    errors.push("沒有解析到任何有效抽獎清單。");
  }

  return {
    wants,
    numberMap,
    warnings,
    errors
  };
}

function parseVipEntries(vipText, numberMap){

  const vipMap={};
  const warnings=[];
  const errors=[];

  if(!vipText){
    return {
      vipMap,
      warnings,
      errors
    };
  }

  const vipLines=vipText
    .split("\n")
    .map(v=>v.trim())
    .filter(v=>v);

  for(let originalLine of vipLines){

    const line=normalizeLotteryLine(originalLine);

    if(!line.includes("：")){
      warnings.push(`已略過格式不完整的 VIP 指定列：「${originalLine}」`);
      continue;
    }

    let [num,name]=splitFirstColon(line);

    num=num.trim();
    name=name.trim();

    if(!num || !name){
      errors.push(`VIP 指定格式不完整：「${originalLine}」`);
      continue;
    }

    if(vipMap[num]){

      if(vipMap[num]===name){
        warnings.push(`${num} 號重複指定給「${name}」，已自動只保留一次。`);
      }else{
        errors.push(`${num} 號被重複指定給「${vipMap[num]}」與「${name}」，請只保留一位。`);
      }

      continue;
    }

    vipMap[num]=name;
  }

  for(let num in vipMap){

    if(!numberMap[num]){
      errors.push(`VIP 指定的 ${num} 號不在抽獎清單中，請確認號碼是否打錯。`);
    }
  }

  return {
    vipMap,
    warnings,
    errors
  };
}

function showValidationFailure(errors, warnings){

  const output=[
    "⚠️ 抽獎前檢查未通過",
    "",
    "請先修正以下問題：",
    ...errors.map((message,index)=>`${index+1}. ${message}`)
  ];

  if(warnings.length){
    output.push(
      "",
      "提醒：",
      ...warnings.map((message,index)=>`${index+1}. ${message}`)
    );
  }

  document.getElementById("result").innerText=output.join("\n");
  alert(`抽獎前檢查發現 ${errors.length} 個需要修正的問題，請看下方結果區。`);
}

function buildWarningText(warnings){

  if(!warnings.length){
    return "";
  }

  return [
    "⚠️ 輸入檢查提醒",
    "",
    ...warnings.map((message,index)=>`${index+1}. ${message}`),
    ""
  ].join("\n");
}

async function startLottery(){

  if(isDrawing){

    if(!confirm("目前正在抽獎，要取消這輪並重新開始嗎？")){
      return;
    }

    activeDrawId++;
  }

  skipMode = false;
  const drawId=++activeDrawId;
  setDrawingState(true);

  try{

    const input=
      document.getElementById("input").value.trim();

    if(!input){
      alert("請輸入抽獎清單");
      finishDraw(drawId);
      return;
    }

    const drawStartedAt=new Date();
    const drawTimeText=drawStartedAt.toLocaleString("zh-TW", {
      hour12:false
    });

    const lines=input
      .split("\n")
      .map(v=>v.trim())
      .filter(v=>v);

    const isSimpleMode =
      !input.includes("：") &&
      !input.includes(":") &&
      !input.includes("➡️");

    const rolling =
      document.getElementById("rollingText");

    if(isSimpleMode){

      document.getElementById("machineIcon").innerHTML = "🎰";

      const parsedSimple=parseSimplePlayers(input);
      const players=parsedSimple.players;
      const warnings=[...parsedSimple.warnings];

      if(players.length < 2){
        showValidationFailure(["至少需要兩位參加者。"], warnings);
        finishDraw(drawId);
        return;
      }

      const drawCount=getDrawCount(players.length);

      rolling.innerHTML = "🎰 抽籤開始！";

      if(!await waitForDraw(drawId, 800)) return;

      for(let i=0;i<(skipMode ? 1 : 20);i++){

        rolling.innerHTML =
          `🎲 抽籤中...<br>
          <span class="final">
          ${escapeHtml(randomPick(players))}
          </span>`;

        if(!await waitForDraw(drawId, 80)) return;
      }

      const winners = randomSample(players, drawCount);
      const winnerText = winners.join("、");

      rolling.innerHTML =
        `🎉 本次中獎者${drawCount>1 ? "們" : ""}<br>
        <span class="final">
        ${escapeHtml(winnerText)}
        </span>`;

      createConfetti();

      document.getElementById("result").innerText =
`🎉 本次抽籤結果

🧾 抽獎紀錄
時間：${drawTimeText}
模式：抽籤抽人
有效參加者：${players.length} 位
抽出人數：${drawCount} 位

${buildWarningText(warnings)}${winners.map((winner,index)=>`${index+1}. ✨ ${winner} ✨`).join("\n")}`;

      finishDraw(drawId);
      return;
    }

    document.getElementById("machineIcon").innerHTML = "🧸";

    const parsedGift=parseGiftEntries(lines);
    const vipText=
      document.getElementById("vipInput").value.trim();
    const parsedVip=parseVipEntries(vipText, parsedGift.numberMap);
    const warnings=[...parsedGift.warnings, ...parsedVip.warnings];
    const errors=[...parsedGift.errors, ...parsedVip.errors];

    if(errors.length){
      showValidationFailure(errors, warnings);
      finishDraw(drawId);
      return;
    }

    const wants=parsedGift.wants;
    const numberMap=parsedGift.numberMap;
    const vipMap=parsedVip.vipMap;
    const settings=getLotterySettings();
    const reservedVipCounts={};

    if(settings.hasWinLimit && settings.vipCountsTowardLimit){

      for(let vipName of Object.values(vipMap)){

        if(!reservedVipCounts[vipName]){
          reservedVipCounts[vipName]=0;
        }

        reservedVipCounts[vipName]++;
      }
    }

    const resultMap={};
    const winCount={};
    const unassignedResults=[];

    for(let name in wants){
      resultMap[name]=[];
      winCount[name]=reservedVipCounts[name] || 0;
    }

    for(let vipName of Object.values(vipMap)){

      if(!resultMap[vipName]){
        resultMap[vipName]=[];
      }

      if(winCount[vipName]===undefined){
        winCount[vipName]=reservedVipCounts[vipName] || 0;
      }
    }

    if(settings.hasWinLimit && settings.vipCountsTowardLimit){

      const vipOverLimitNames=Object.keys(reservedVipCounts)
        .filter(name=>reservedVipCounts[name] > settings.maxWins);

      if(vipOverLimitNames.length){

        warnings.push(
          `${vipOverLimitNames.join("、")} 的 VIP 指定數已超過每人最多 ${settings.maxWins} 樣，指定贈物仍照常分配。`
        );
      }
    }

    rolling.innerHTML="🎰 抽獎開始！";

    if(!await waitForDraw(drawId, 1000)) return;

    const numbers=
      Object.keys(numberMap)
      .sort(compareItems);

    for(let num of numbers){

      const players=numberMap[num];
      const eligiblePlayers=settings.hasWinLimit
        ? players.filter(name=>(winCount[name] || 0) < settings.maxWins)
        : players;

      if(vipMap[num]){

        const vipWinner=vipMap[num];

        rolling.innerHTML=
          `👑 ${escapeHtml(num)} 號為特權指定<br>
          <span class="final">${escapeHtml(vipWinner)}</span>`;

        resultMap[vipWinner].push(num);

        createConfetti();

        if(!await waitForDraw(drawId, 1500)) return;

        continue;
      }

      if(!eligiblePlayers.length){

        rolling.innerHTML=
          `⚠️ ${escapeHtml(num)} 號無可抽選得主<br>
          <span class="final">已達上限</span>`;

        unassignedResults.push({
          num,
          reason:"所有填選者已達中獎上限"
        });

        if(!await waitForDraw(drawId, 1200)) return;

        continue;
      }

      rolling.innerHTML=
        `🎁 正在抽 ${escapeHtml(num)} 號`;

      if(!await waitForDraw(drawId, 700)) return;

      let winner="";

      if(eligiblePlayers.length===1){

        winner=eligiblePlayers[0];

        rolling.innerHTML=
          `✨ ${escapeHtml(num)} 號直接得主：<br>
          <span class="final">${escapeHtml(winner)}</span>`;

      }else{

        for(let i=0;i<(skipMode ? 1 : 15);i++){

          rolling.innerHTML=
            `🎰 ${escapeHtml(num)} 號抽選中...<br>
            <span class="final">
            ${escapeHtml(randomPick(eligiblePlayers))}
            </span>`;

          if(!await waitForDraw(drawId, 80)) return;
        }

        winner=randomPick(eligiblePlayers);

        rolling.innerHTML=
          `🎉 ${escapeHtml(num)} 號得主：<br>
          <span class="final">${escapeHtml(winner)}</span>`;
      }

      resultMap[winner].push(num);

      if(settings.hasWinLimit){
        winCount[winner]=(winCount[winner] || 0)+1;
      }

      createConfetti();

      if(!await waitForDraw(drawId, 1500)) return;
    }

    let output="🎁 抽選結果清單\n\n";

    output+="🧾 抽獎紀錄\n";
    output+=`時間：${drawTimeText}\n`;
    output+="模式：贈物號碼抽選\n";
    output+=`有效參加者：${Object.keys(wants).length} 位\n`;
    output+=`有效號碼：${numbers.length} 個\n`;
    output+=`VIP 指定：${Object.keys(vipMap).length} 個\n`;

    if(settings.hasWinLimit){

      output+=`中獎限制：每人最多 ${settings.maxWins} 樣`;
      output+=settings.vipCountsTowardLimit
        ? "｜VIP 指定計入中獎數\n"
        : "｜VIP 指定不計入中獎數\n";
    }else{
      output+="中獎限制：不限\n";
    }

    output+="\n";
    output+=buildWarningText(warnings);

    for(let name in resultMap){

      const items=resultMap[name];

      output+=`${name}：`;

      if(items.length){

        items.sort(compareItems);

        output+=items.join("、");
        output+=`\n（共${items.length}樣）寄編：`;

      }else{

        output+="未抽中";
      }

      output+="\n\n";
    }

    output+="📦 各號碼得主對照\n\n";

    const allResults=[];

    for(let name in resultMap){

      for(let num of resultMap[name]){

        allResults.push({
          num,
          sortValue:getItemSortValue(num),
          name
        });
      }
    }

    allResults.sort((a,b)=>{

      if(a.sortValue!==b.sortValue){
        return a.sortValue-b.sortValue;
      }

      return a.num.localeCompare(b.num,"zh-Hant");
    });

    for(let item of allResults){

      output+=`${item.num} ➡️ ${item.name}\n`;
    }

    if(unassignedResults.length){

      output+="\n⚠️ 未抽出號碼\n\n";

      for(let item of unassignedResults){
        output+=`${item.num}：${item.reason}\n`;
      }
    }

    document.getElementById("result").innerText=
      output;

    rolling.innerHTML=
      "🎊 全部抽獎完成！";

    finishDraw(drawId);

  }catch(error){

    console.error(error);
    document.getElementById("result").innerText=
      `⚠️ 抽獎時發生錯誤：${error.message}`;
    finishDraw(drawId);
  }
}

function skipAnimation(){

  if(!isDrawing){
    alert("目前沒有正在進行的抽獎");
    return;
  }

  skipMode = true;

  document.getElementById("rollingText").innerHTML =
    "⏩ 已跳過後續動畫";
}

function cancelLottery(){

  if(!isDrawing){
    return;
  }

  activeDrawId++;
  skipMode = true;
  setDrawingState(false);

  document.getElementById("rollingText").innerHTML =
    "⛔ 抽獎已取消";
}

async function copyResult(){

  const text=
    document.getElementById("result").innerText;

  try{

    await navigator.clipboard.writeText(text);
    alert("已複製抽獎結果 ✨");

  }catch(error){
    alert("複製失敗，可能是瀏覽器權限限制。請直接選取結果文字複製。");
  }
}

function clearResult(){

  activeDrawId++;
  skipMode = true;
  setDrawingState(false);

  document.getElementById("result").innerText=

    "尚未抽獎";

  document.getElementById("rollingText").innerHTML=

    "等待抽獎中...";

  document.getElementById("machineIcon").innerHTML = "🧸";

}

function clearAll(){

  if(!confirm("確定要清空全部內容嗎？")){
    return;
  }

  activeDrawId++;
  skipMode = true;
  setDrawingState(false);

  document.getElementById("input").value="";

  document.getElementById("vipInput").value="";

  document.getElementById("result").innerText=
    "尚未抽獎";

  document.getElementById("rollingText").innerHTML=
    "等待抽獎中...";
    
    document.getElementById("machineIcon").innerHTML = "🧸";
}

</script>
